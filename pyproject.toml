[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jsteer"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "docs/licenses/*.txt"]
description = "When are J-Lens read directions valid write directions? Prompt-local Jacobian analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=5.5",
    "huggingface_hub",
    "numpy",
    "pyyaml",
    "datasets",
    "requests",
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "modal"]
analysis = ["pandas", "scipy", "matplotlib", "pymupdf"]
remote = ["modal"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["jsteer"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741: `l` for layer index, matching jlens's own convention.
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not slow'"
markers = ["slow: needs a real model download / many minutes", "network: hits HF or Neuronpedia"]
